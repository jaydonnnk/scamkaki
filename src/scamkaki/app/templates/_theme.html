<style>
:root{
  --midnight:#0a1a3f;--midnight-2:#13296b;
  --ice-50:#f4f8fe;--ice-100:#e4effb;--ice-200:#c5d8ef;
  --electric:#1546d8;--chartreuse:#c9f227;
  --ink:#0a1a3f;--muted:#3f5483;
  --danger:#a80f2a;--danger-bg:#fde9ec;--caution:#744400;--caution-bg:#fff1cf;
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Kohinoor Devanagari",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ice-50);color:var(--ink);font:15px/1.5 var(--font)}
a{color:var(--electric);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--electric);outline-offset:2px;border-radius:2px}
.bar :focus-visible{outline-color:var(--chartreuse)}
.bar{background:var(--midnight);color:var(--ice-50);border-bottom:4px solid var(--electric)}
.bar-inner{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-size:20px;font-weight:800;letter-spacing:.01em;margin:0}
.brand small{display:block;font-size:13px;font-weight:500;color:var(--ice-200);letter-spacing:0}
.bar a{color:var(--ice-50)}
.fixture{margin:0 0 0 auto;background:var(--chartreuse);color:var(--midnight);font-weight:700;font-size:13px;line-height:1.3;padding:6px 10px;border-radius:4px}
main{max-width:1180px;margin:0 auto;padding:16px}
main.narrow{max-width:760px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px;font-weight:700}
.panel{background:#fff;border:1px solid var(--ice-200);border-radius:8px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--ice-100);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--ice-100);white-space:nowrap}
tr:last-child td{border-bottom:0}
.empty{color:var(--muted)}
.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
button,.btn{font:inherit;font-weight:600;min-height:44px;padding:8px 16px;border-radius:6px;border:2px solid var(--electric);background:var(--electric);color:#fff;cursor:pointer}
button.secondary{background:transparent;color:var(--electric)}
button:disabled{opacity:.5;cursor:default}
.badge{display:inline-block;font-weight:700;font-size:13px;line-height:1.3;padding:3px 9px;border-radius:4px;border:2px solid}
.v-likely_scam{color:var(--danger);background:var(--danger-bg);border-color:var(--danger)}
.v-likely_scam::before{content:"\25B2  ";content:"\25B2  " / ""}
.v-unclear{color:var(--caution);background:var(--caution-bg);border-color:var(--caution);border-style:dashed}
.v-unclear::before{content:"\25C6  ";content:"\25C6  " / ""}
.v-no_scam_signs{color:var(--ink);background:var(--ice-100);border-color:var(--ice-200);font-weight:600}
.v-no_scam_signs::before{content:"\25CB  ";content:"\25CB  " / ""}
.urgent-tag{display:inline-block;background:var(--danger);color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;padding:3px 8px;border-radius:4px;margin-right:6px}
.leak{color:var(--danger);font-weight:700}
.signs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.signs li{border:1px solid var(--ice-200);background:var(--ice-50);border-radius:4px;padding:1px 7px;font-size:13px}
.sub{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.reviewer{--line:#d6e2f1}
.reviewer h1{font-size:34px;letter-spacing:-1.2px;line-height:1.15;margin:8px 0 10px}
.reviewer h2{font-size:19px;line-height:1.3;margin:0 0 12px;letter-spacing:-.3px;text-transform:none;color:var(--ink)}
.reviewer h3{font-size:16px;margin:0 0 6px}
.reviewer p{margin:0 0 12px}
.reviewer a:hover{text-decoration:underline}
.skip{position:fixed;top:8px;left:20px;z-index:9;transform:translateY(-200%)}
.skip:focus{transform:none}
.sidebar{position:fixed;inset:0 auto 0 0;width:218px;background:var(--midnight);color:white;padding:31px 18px;display:flex;flex-direction:column}
.sidebar .brand{display:flex;align-items:center;gap:11px;color:white;font-size:23px;padding:0 12px 32px;text-decoration:none;letter-spacing:-1px}
.ico{width:32px;height:36px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sidebar .ico{color:var(--chartreuse)}
.sidebar nav{display:grid;gap:5px}
.sidebar nav a{display:block;color:var(--ice-200);padding:12px 14px;border-radius:8px;font-weight:600;text-decoration:none;min-height:44px}
.sidebar nav a[aria-current]{background:#20375e;color:white;box-shadow:inset 3px 0 var(--electric)}
.sidebar nav a:hover{background:#172e55;text-decoration:underline}
.sidebar :focus-visible{outline-color:var(--chartreuse)}
.navfoot{margin-top:auto;padding:20px 12px 0;color:var(--ice-200);font-size:12px}
.navfoot strong{display:block;color:white;font-size:14px;margin-bottom:4px}
.workspace{margin-left:218px;min-width:0}
.top{padding:17px 38px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px;background:white;font-size:13px;color:var(--muted)}
.reviewer .fixture{margin:0;font-size:12px;max-width:100%}
.workspace main{max-width:1350px;margin:auto;padding:34px 38px 50px;overflow-wrap:anywhere}
.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}
.heading p{color:var(--muted);margin:0;max-width:65ch}
.reviewer .panel{border-color:var(--line);border-radius:12px;min-width:0}
.pad{padding:25px}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(275px,1fr);gap:22px;align-items:start}
.stack{display:grid;gap:22px;align-content:start;min-width:0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.sectionhead h2{margin:0}
.priority{border-left:4px solid var(--danger)!important;background:var(--danger-bg)}
.event{padding:19px 0;border-bottom:1px solid var(--line)}
.event:last-child{border-bottom:0;padding-bottom:0}
.event:first-child{padding-top:0}
.event p{color:var(--muted);font-size:13px;margin:5px 0}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.flow{display:flex;gap:10px;margin:24px 0;align-items:stretch}
.node{flex:1;padding:17px 12px;border:1px solid var(--line);border-radius:9px;background:var(--ice-50);min-width:0}
.node strong,.node small{display:block}
.node small{color:var(--muted);margin-top:4px}
.arrow{align-self:center;color:var(--muted);font-size:22px}
.matching-flow{flex-direction:column}
.matching-flow>.arrow{transform:rotate(90deg)}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 15px;margin:20px 0 12px}
.responsive td[data-label="Seen"]{white-space:nowrap}
.pattern-label{font-weight:600}
.pattern-count{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bartrack{grid-column:1/-1;height:12px;background:var(--ice-100);border-radius:3px;overflow:hidden}
.barfill{height:100%;background:var(--electric)}
.pattern+.pattern{border-top:1px solid var(--line);padding-top:8px}
.pattern .facts{margin-bottom:14px}
.reviewed{background:var(--midnight);color:var(--ice-50);border-color:var(--midnight)}
.reviewtext{border:1px solid var(--line);padding:22px;border-radius:8px;margin-top:22px;background:var(--ice-50)}
.report-draft{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.65 var(--font);margin:14px 0 0}
.report-summary{margin-top:22px}
.checkrow{display:flex;gap:12px;align-items:flex-start;margin:22px 0;min-height:44px;cursor:pointer}
.checkrow input{flex:none;width:22px;height:22px;margin:1px 0;accent-color:var(--electric)}
.review-limit{margin-top:14px!important}
.voice-options{display:grid;grid-template-columns:1fr 1fr;gap:16px;border:0;padding:0;margin:0 0 22px;min-width:0}
.voice-options legend{font-weight:600;margin-bottom:12px}
.voice-choice{display:block;padding:20px;border:2px solid var(--line);border-radius:12px;background:white;cursor:pointer}
.voice-choice:has(input:checked){border-color:var(--electric);background:var(--ice-100)}
.voice-choice input{width:20px;height:20px;margin:0 0 14px;accent-color:var(--electric)}
.voice-choice strong,.voice-choice .sub{display:block;margin:0 0 6px}
.voice-language{display:grid;gap:10px;font-weight:600}
.voice-language select{font:inherit;padding:12px;border:1px solid var(--ice-200);border-radius:7px;min-height:44px;width:100%;background:white;color:var(--ink)}
.voice-art{display:block;width:100%;height:150px;color:var(--electric);margin:22px 0}
.voice-actions{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}
.listlink{display:block;padding:17px 0;border-bottom:1px solid var(--line)}
.listlink:last-child{border:0}
.toolbar{padding:18px 20px;display:flex;gap:12px;align-items:end;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.toolbar label:first-child{flex:1;min-width:150px}
.toolbar input,.toolbar select{font:inherit;border:1px solid #b8c9df;border-radius:7px;background:white;color:var(--ink);padding:10px 12px;min-height:44px;max-width:100%;width:100%}
.tablewrap{overflow-x:auto}
.reviewer th{background:#f8fafd;text-transform:none}
.reviewer td{padding:19px 20px;overflow-wrap:anywhere}
.reviewer td small{display:block;color:var(--muted);margin-top:3px}
.tablefoot{padding:15px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.notice{padding:14px 18px;border-radius:8px;background:var(--ice-100);color:var(--muted);font-size:13px;margin:18px 0}
.breadcrumbs{font-size:13px;color:var(--muted);margin-bottom:19px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin:0}
.facts div{padding:15px 0;border-bottom:1px solid var(--line);min-width:0}
.facts dt{font-size:12px;color:var(--muted);margin-bottom:5px}
.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.reviewer details{border-top:1px solid var(--line);padding:16px 0}
.reviewer summary{cursor:pointer;font-weight:600;min-height:44px;padding:8px 0}
.turn{margin:12px 0;padding:14px;background:var(--ice-50);border-radius:8px}
.turn p{white-space:pre-wrap;margin:6px 0 0;overflow-wrap:anywhere}
.empty-state{padding:36px 20px;color:var(--muted);text-align:center}
.bottomnote{margin-top:28px!important;font-size:12px;color:var(--muted)}
.reviewer .btn{display:inline-flex;align-items:center;text-decoration:none}
@media(max-width:1050px){.sidebar{width:182px;padding:25px 10px}.workspace{margin-left:182px}.workspace main{padding:26px 22px}.top{padding:16px 22px}.grid{grid-template-columns:1fr}}
@media(max-width:650px){
  .sidebar{position:static;width:100%;padding:16px}.sidebar .brand{padding:0 0 15px}.sidebar nav{display:flex;gap:5px;flex-wrap:wrap}.sidebar nav a{font-size:13px;padding:9px 12px}.navfoot{display:none}
  .workspace{margin:0}.top{padding:12px 18px;flex-wrap:wrap;gap:6px}.workspace main{padding:24px 18px}.heading{display:block}.heading>.btn{margin-top:16px}.reviewer h1{font-size:29px}.pad{padding:20px}
  .flow{flex-direction:column}.arrow{transform:rotate(90deg)}.facts{grid-template-columns:1fr}.tablewrap{overflow:visible}
  .responsive thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .responsive,.responsive tbody{display:block}.responsive tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:16px 18px;border-bottom:1px solid var(--line);gap:12px}
  .responsive td{display:block;padding:0;border:0;font-size:13px;min-width:0}.responsive td::before{content:attr(data-label);font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.responsive td:first-child{grid-column:1/-1}
  .toolbar label:first-child{width:100%;flex-basis:100%}.toolbar label{flex:1}
  .voice-options{grid-template-columns:1fr}.voice-actions button{width:100%}
}
</style>
