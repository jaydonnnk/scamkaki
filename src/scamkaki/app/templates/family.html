<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Ah Ma Guardian family alerts</title>
{% include "_theme.html" %}
<style>
main{max-width:600px}
h1{font-size:24px;margin:0 0 4px}
.alert{border:3px solid var(--danger);background:var(--danger-bg);border-radius:8px;padding:16px;margin:16px 0}
.alert h2{color:var(--danger);font-size:22px;letter-spacing:0;text-transform:none;margin:0 0 8px}
.alert h2::before{content:"\25B2  ";content:"\25B2  " / ""}
.alert p{margin:4px 0}.alert .do{font-weight:700;font-size:17px;margin-top:12px}.alert .meta{color:var(--muted);font-size:13px;margin-top:8px}
.alert.urgent{border-width:3px;box-shadow:inset 10px 0 0 var(--danger);padding-left:26px}
.tag{display:inline-block;background:var(--danger);color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em;padding:3px 9px;border-radius:4px;margin:0 0 8px}
.flash{animation:flash 1s ease-in-out infinite}
@keyframes flash{50%{background:var(--ice-50)}}
button[aria-pressed="true"]{background:var(--midnight);border-color:var(--midnight);color:var(--ice-50)}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
ul{list-style:none;padding:0;margin:0}li{padding:10px 0;border-bottom:1px solid var(--ice-200);font-size:14px}
.time{font-weight:700}
.status{color:var(--muted);font-size:14px;margin:8px 0 0}.status:empty{display:none}
</style></head><body>
<header class="bar"><div class="bar-inner">
<p class="brand">Ah Ma Guardian<small>Family alerts</small></p>
<p class="fixture">Demo fixtures. Test calls, not real scammers.</p>
</div></header><main>
<p class="sub">Keep this page open, or rely on the Telegram message.</p>
<p><button id="sound" class="secondary" aria-pressed="false">Turn on sound</button></p>
<p class="status" id="status" role="status"></p>
<div id="latest" aria-live="assertive"><p class="empty">No alerts yet. This page checks every 5 seconds.</p></div>
<h3>Earlier alerts</h3>
<ul id="earlier"><li class="empty">None.</li></ul>
</main>
<script>
const AGENCIES = {{ agencies | tojson }};
const DEMANDS = {{ demands | tojson }};
const CHANNELS = {{ channels | tojson }};
const TACTICS = {{ tactics | tojson }};
const ACTED = {{ acted | tojson }};
const LANGUAGES = {{ languages | tojson }};
const TELEGRAM = {pending: "sending", sent: "sent", failed: "failed", off: "not set up"};
const alertsUrl = location.pathname.replace(/\/$/, "") + "/alerts";
const seen = new Set();
let firstLoad = true;
let flashUntil = 0;
let audio = null;

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

const SGT = {timeZone: "Asia/Singapore"};

function when(iso) {
  const at = new Date(iso);
  const time = at.toLocaleTimeString("en-SG", {...SGT, hour: "2-digit", minute: "2-digit", hour12: false});
  const day = (d) => d.toLocaleDateString("en-SG", SGT);
  if (day(at) === day(new Date())) return "Today " + time;
  return at.toLocaleDateString("en-SG", {...SGT, weekday: "short", day: "numeric", month: "short"}) + " " + time;
}

function labelled(label, value) {
  const p = el("p", label + ": ");
  p.append(el("strong", value));
  return p;
}

function signs(a) {
  return (a.tactics || []).map((t) => TACTICS[t] || t).join(" · ");
}

function renderLatest(a, isNew) {
  const box = el("section", undefined, "alert" + (a.urgent ? " urgent" : "") + (isNew ? " flash" : ""));
  if (a.urgent) box.append(el("p", "Urgent: Ah Ma already acted", "tag"));
  box.append(el("h2", "Likely scam"));
  if (a.urgent) box.append(labelled("Ah Ma already", ACTED[a.acted] || a.acted));
  const who = labelled("Contacted by", CHANNELS[a.channel] || a.channel);
  who.append(", claiming to be ");
  who.append(el("strong", AGENCIES[a.agency] || a.agency));
  box.append(who);
  box.append(labelled("Asked for", DEMANDS[a.demand] || a.demand));
  if (a.tactics && a.tactics.length) box.append(labelled("Warning signs", signs(a)));
  box.append(el("p", "Line: " + (LANGUAGES[a.language] || a.language) + " · " + when(a.created_at)));
  if (a.similar_count > 0) box.append(el("p", "Same script heard " + a.similar_count + (a.similar_count === 1 ? " time" : " times") + " this week."));
  box.append(el("p", a.urgent
    ? "Call Ah Ma now. Help her call the bank on the number on the back of her card."
    : "Please call Ah Ma now.", "do"));
  box.append(el("p", "Telegram: " + (TELEGRAM[a.alert_status] || "unknown"), "meta"));
  document.getElementById("latest").replaceChildren(box);
}

function renderEarlier(list) {
  const ul = document.getElementById("earlier");
  if (!list.length) { ul.replaceChildren(el("li", "None.", "empty")); return; }
  ul.replaceChildren(...list.map((a) => {
    const li = el("li");
    li.append(el("span", when(a.created_at), "time"));
    if (a.urgent) li.append(" · Urgent");
    li.append(" · " + (LANGUAGES[a.language] || a.language) + " · "
      + (CHANNELS[a.channel] || a.channel) + ", "
      + (AGENCIES[a.agency] || a.agency) + ", " + (DEMANDS[a.demand] || a.demand));
    return li;
  }));
}

function beep() {
  if (!audio) return;
  [0, 0.4, 0.8].forEach((t) => {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.2;
    osc.connect(gain).connect(audio.destination);
    osc.start(audio.currentTime + t);
    osc.stop(audio.currentTime + t + 0.25);
  });
}

async function check() {
  try {
    const response = await fetch(alertsUrl, {cache: "no-store"});
    if (!response.ok) throw new Error(response.status);
    const alerts = await response.json();
    document.getElementById("status").textContent = "";
    const fresh = alerts.filter((a) => !seen.has(a.id));
    alerts.forEach((a) => seen.add(a.id));
    const isNew = !firstLoad && fresh.length > 0;
    if (isNew) flashUntil = Date.now() + 30000;
    if (alerts.length) renderLatest(alerts[0], Date.now() < flashUntil);
    renderEarlier(alerts.slice(1));
    if (isNew) { beep(); document.title = "Likely scam call - Ah Ma Guardian"; }
    firstLoad = false;
  } catch (error) {
    document.getElementById("status").textContent = "Cannot reach the server. Trying again.";
  }
}

document.getElementById("sound").addEventListener("click", (event) => {
  audio = audio ? null : new AudioContext();
  event.target.setAttribute("aria-pressed", String(Boolean(audio)));
  event.target.textContent = audio ? "Sound on" : "Turn on sound";
  if (audio) beep();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) document.title = "Ah Ma Guardian family alerts";
});

check();
setInterval(check, 5000);
</script></body></html>
