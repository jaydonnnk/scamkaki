[project]
name = "scamkaki"
version = "0.1.0"
description = "Scamkaki: Bolna voice agents that bait scammers and guard Singapore seniors."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scamkaki"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["outputs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
